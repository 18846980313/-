<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lj</title>
</head>
<body>
    <h2>HTML表单form</h2>
    <forM action="https://www.baidu.com/s">
    <p>
        <label for="wd">请输入搜索内容：</label>
        用户名：<input type="text" name="username">
    </p>
    <p>
        密码：<input type="password" name="password">
    </p>    
    <p>
        性别：<input type="radio" name="gender" value="male">男
        <input type="radio" name="gender" value="female">女
    </p>
    <p>
       <input type="radio" name="gender" value="secret">保密
    </p>
    <p>
        爱好：<input type="checkbox" name="hobby" value="sports">运动
        <input type="checkbox" name="hobby" value="music">音乐
        <input type="checkbox" name="hobby" value="reading">阅读    
    </p>
    <p>
        籍贯：<select name="native">
            <option value="china" selected>中国</option>
            <option value="usa">美国</option>
            <option value="japan">日本</option>
            <option value="korea">韩国</option> 
        </select>
    </p>
    <p>
        个人简介：<textarea name="introduction" id="" cols="30" rows="10"></textarea>
    </p>
    <p>
        出生日期：<input type="date" name="birthday">
    </p>
    <p>
        多文件上传：<input type="file" name="files" multiple>
    </p>
    <p>
       普通按钮：<input type="button" value="普通按钮">
       提交按钮：<input type="submit" value="提交">
       重置按钮：<input type="reset" value="重置">
    </p>
    </forM>
    <button>表单外的按钮</button>
</body>
</html>
