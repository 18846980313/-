<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 幻灯片 - lj1029</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .slider {
            width: 600px;
            height: 400px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: slideLeft 9s infinite;
        }

        .slide:nth-child(1) {
            animation-delay: 0s;
        }

        .slide:nth-child(2) {
            animation-delay: 3s;
        }

        .slide:nth-child(3) {
            animation-delay: 6s;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            text-align: center;
        }

        .slide-text h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .slide-text p {
            font-size: 16px;
            color: #ddd;
        }

        .slide-text .mark {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 16px;
            border: 1px solid #fff;
            color: #fff;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 2px;
        }

        @keyframes slideLeft {
            0% {
                transform: translateX(100%);
                opacity: 0;
            }
            10% {
                transform: translateX(0);
                opacity: 1;
            }
            33% {
                transform: translateX(0);
                opacity: 1;
            }
            43% {
                transform: translateX(-100%);
                opacity: 0;
            }
            100% {
                transform: translateX(-100%);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slide">
            <img src="1.png" alt="图片1">
            <div class="slide-text">
                <h2>CSS 动画幻灯片</h2>
                <p>纯 CSS 实现图片自动轮播效果</p>
                <span class="mark">lj1029</span>
            </div>
        </div>
        <div class="slide">
            <img src="2.png" alt="图片2">
            <div class="slide-text">
                <h2>CSS 动画幻灯片</h2>
                <p>纯 CSS 实现图片自动轮播效果</p>
                <span class="mark">lj1029</span>
            </div>
        </div>
        <div class="slide">
            <img src="3.png" alt="图片3">
            <div class="slide-text">
                <h2>CSS 动画幻灯片</h2>
                <p>纯 CSS 实现图片自动轮播效果</p>
                <span class="mark">lj1029</span>
            </div>
        </div>
    </div>
</body>
</html>
