<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体查询布局 - lj1029</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            padding: 20px;
            background-color: #1a1a2e;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 120px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            transition: all 0.3s ease;
        }

        .box:nth-child(1) { background-color: #ff6b6b; }
        .box:nth-child(2) { background-color: #4ecdc4; }
        .box:nth-child(3) { background-color: #ffe66d; color: #333; }
        .box:nth-child(4) { background-color: #a8e6cf; color: #333; }
        .box:nth-child(5) { background-color: #ff8b94; }
        .box:nth-child(6) { background-color: #c7ceea; color: #333; }
        .box:nth-child(7) { background-color: #ffd93d; color: #333; }
        .box:nth-child(8) { background-color: #6bcb77; }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #fff;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .mark {
            display: inline-block;
            padding: 8px 24px;
            border: 2px solid #fff;
            border-radius: 24px;
            margin-top: 12px;
        }

        /* 手机端：1个一行 */
        @media screen and (max-width: 480px) {
            .box {
                flex: 0 0 100%;
            }
        }

        /* 小平板：2个一行 */
        @media screen and (min-width: 481px) and (max-width: 768px) {
            .box {
                flex: 0 0 calc(50% - 8px);
            }
        }

        /* 大平板/小电脑：4个一行 */
        @media screen and (min-width: 769px) and (max-width: 1024px) {
            .box {
                flex: 0 0 calc(25% - 12px);
            }
        }

        /* 大屏幕电脑：8个一行 */
        @media screen and (min-width: 1025px) {
            .box {
                flex: 0 0 calc(12.5% - 14px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>
    <div class="footer">
        <p>媒体查询响应式布局</p>
        <span class="mark">lj1029</span>
    </div>
</body>
</html>
