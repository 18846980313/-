<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
           padding: 0;
           margin: 0;
        }
        #box{
            width: 400px;
            padding: 8px;
            border: 1px solid #ccc;
            font-size: 12px;
            margin: 20px;
        }
        #box h3{
            font-size: 18px;
            text-align: center;
            line-height: 30px;
            color: red;
        }
        #box p{
            
            line-height: 20px;
            color: #666;
            text-indent: 2em;
        }
        #box p a{
            color: red;
            text-decoration: none;
            font-size: 12px;
        }
        .sid{
            color: blue;
            font-weight: bold;
        }
        .name{
            color: #333;
            font-weight: bold;
        }
        .diff{
            color: red;
            font-weight: bold;
        }
        .kp{
            outline: 1px solid purple;
            padding: 0 3px;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            学号:<span class="sid">029</span>,姓名:<span class="name">李佳</span>,班级:计算机24011，对于《高级网页设计课程》的难度认知为：<span class="diff">还行</span>
            这个例子对应的知识点是：<span class="kp">群组选择器、后代选择器、层叠与集成</span>。
            <a href="#">更多>></a>

        </p>
    </div>
<!--学号:蓝色加粗；姓名:深色加粗；难度的值:红色加粗；知识点:紫色边框，边框为额外内容，使用内部css-->
</body>
</html>
