<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
             padding: 0%;
           margin: 0%;
        }
        body{
            width: 600px;
            margin: 0 auto;
        }
        .box{
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .img-wrap{
            position: relative;
            width: 160px;
            flex-shrink: 0;
        }
        .img-wrap img{
            width: 100%;
            display: block;
            border-radius: 4px;
        }
        .img-wrap .mask{
            display: none;
        }
        .info{
            margin-left: 15px;
            flex: 1;
        }
        .info h3{
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }
        .info .author{
            font-size: 14px;
            color: #999;
        }
        .info .time{
            font-size: 14px;
            color: #999;
            float: right;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="img-wrap">
            <img src="./111 (1).png" >
            <div class="mask">学习贯彻党的二十届四中全会精神</div>
        </div>
        <div class="info">
            <h3>标题</h3>
            <span class="author">李佳</span>
            <span class="time">2020-10-10</span>
        </div>
    </div>
     <div class="box">
        <div class="img-wrap">
            <img src="./111 (2).png" >
            <div class="mask">我们的中国梦 文化进万家</div>
        </div>
        <div class="info">
            <h3>标题</h3>
            <span class="author">李佳</span>
            <span class="time">2020-10-10</span>
        </div>
    </div>
     <div class="box">
        <div class="img-wrap">
            <img src="./111 (3).png" >
            <div class="mask">加快发展新质生产力</div>
        </div>
        <div class="info">
            <h3>标题</h3>
            <span class="author">李佳</span>
            <span class="time">2020-10-10</span>
        </div>
    </div>
</body>
</html>
