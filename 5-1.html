<!DOCTYPE html>
<html lang="en">
<link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1029lj</title>
       <link rel="stylesheet" href="css.css"></link>
    <style>
        p{
            color: red;
            font-size: 100px;
        }
        .text{
            color:chartreuse;
        }
        #text{
            color:darkgoldenrod;
        }
        .box p{
            color:darkcyan;
        }
        #box #text{
            color:darkmagenta;
        }
        .text{
            color:yellow!important;
            /* 可覆盖内嵌 */
        }
        #box{
            /* 宽400，高400，灰色背景，距离20，字间距20*/
            width: 1400px;
            height: 400px;
            background-color: #f5f5f7;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            letter-spacing: 20px;
            /* 圆角矩形50px */
            border-radius: 50px;
            
            }
    </style>
<!-- 优先级 标签# -->
    <!-- 后定义的覆盖前定义的 -->
</head>
<body>
    <h2>层叠与继承</h2>
    <div id="box" class="box">
        <p id="text" class="text">1029lj</p >
        <p>层叠与继承的优先级</p >
    </div>
</body>
</html>
