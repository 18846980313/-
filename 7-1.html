<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
             padding: 0%;
           margin: 0%;
        }
        ul{
           list-style: none;
        }
        img{}
            .ilist {
                display: flex;
            }
            .ilist li{
            width: 33%;
            margin-right: 1px;
            flex-grow: 1;
            position: relative;
            }
            .ilist img{
               width: 100%;
               display: block;
            }
            .ilist p{
          /* 居中 */
          text-align: center;
          /* 字体大小 */
          font-size: 12px;
          /* 行高 */
          line-height: 30px;
          /*绝对定位*/
          position: absolute;
          left: 0;
          bottom: 0;
          width: 100%;
          background-color: rgba(0, 0, 0, 0.6);
          color: #fff;
          font-weight: bold;
            }
                </style>

</head>
<body>
    <ul class="ilist">
        <li><img src="./111 (1).png" >
        <p>李佳的上图下文</p>
        </li>
        <li><img src="./111 (2).png" >
        <p>李佳的下图下文</p>
        </li>
        <li><img src="./111 (3).png" >
        <p>李佳的下图下文</p>
        </li>
    </ul>

    
</body>
</html>
